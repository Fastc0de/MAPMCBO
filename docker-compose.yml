# Buscador web propio para el chatbot (SearXNG). Arranca con: docker compose up -d
# Queda solo en tu PC (127.0.0.1:8888). En .env.local: SEARXNG_URL=http://localhost:8888
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Solo IPv4 dentro del contenedor: evita fallos en equipos sin IPv6.
      - GRANIAN_HOST=0.0.0.0
      # Cámbiala si expones el buscador fuera de tu PC.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-mapa-maracaibo-solo-local}
